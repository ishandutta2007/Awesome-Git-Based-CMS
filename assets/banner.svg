<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="280" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .pulsing-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .pulsing-node-delay {
        animation: pulse 3s ease-in-out infinite alternate 1.5s;
      }
      .git-line {
        stroke-dasharray: 8, 6;
        animation: dash 20s linear infinite;
      }
      .shimmer-badge {
        animation: shimmer 4s ease-in-out infinite;
      }
      .float-orb-1 {
        animation: float 6s ease-in-out infinite alternate;
      }
      .float-orb-2 {
        animation: float 8s ease-in-out infinite alternate-reverse;
      }
      @keyframes pulse {
        0% { transform: scale(0.92); opacity: 0.4; }
        100% { transform: scale(1.08); opacity: 0.9; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes shimmer {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      @keyframes float {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-12px) translateX(8px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #F8FAFC;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94A3B8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38BDF8;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners and Glowing Border -->
  <rect x="2" y="2" width="876" height="276" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Dynamic Background Lights (Animated Glowing Orbs) -->
  <g class="float-orb-1" style="transform-origin: 150px 70px;">
    <circle cx="150" cy="70" r="100" fill="#38BDF8" opacity="0.12" filter="url(#glow)"/>
  </g>
  <g class="float-orb-2" style="transform-origin: 730px 200px;">
    <circle cx="730" cy="200" r="120" fill="#C084FC" opacity="0.12" filter="url(#glow)"/>
  </g>

  <!-- Background Decorative Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="56" x2="880" y2="56" />
    <line x1="0" y1="112" x2="880" y2="112" />
    <line x1="0" y1="168" x2="880" y2="168" />
    <line x1="0" y1="224" x2="880" y2="224" />
    <line x1="146" y1="0" x2="146" y2="280" />
    <line x1="293" y1="0" x2="293" y2="280" />
    <line x1="440" y1="0" x2="440" y2="280" />
    <line x1="586" y1="0" x2="586" y2="280" />
    <line x1="733" y1="0" x2="733" y2="280" />
  </g>

  <!-- Dynamic Git Flow Visualization (Background Layer) -->
  <g opacity="0.6">
    <!-- Main branch -->
    <path d="M 50 140 L 830 140" stroke="#475569" stroke-width="2.5" />
    <!-- Feature branch 1 -->
    <path d="M 160 140 Q 200 80, 260 80 L 400 80 Q 460 80, 500 140" fill="none" stroke="#38BDF8" stroke-width="2" class="git-line" />
    <!-- Feature branch 2 -->
    <path d="M 380 140 Q 420 200, 480 200 L 620 200 Q 680 200, 720 140" fill="none" stroke="#C084FC" stroke-width="2" class="git-line" />

    <!-- Commit Nodes -->
    <circle cx="160" cy="140" r="6" fill="#38BDF8" />
    <circle cx="260" cy="80" r="5" fill="#38BDF8" />
    <circle cx="400" cy="80" r="5" fill="#38BDF8" />
    <circle cx="380" cy="140" r="6" fill="#818CF8" />
    <circle cx="480" cy="200" r="5" fill="#C084FC" />
    <circle cx="620" cy="200" r="5" fill="#C084FC" />
    <circle cx="500" cy="140" r="6" fill="#818CF8" />
    <circle cx="720" cy="140" r="6" fill="#C084FC" />
  </g>

  <!-- Animated Pulse Nodes Behind Text -->
  <g class="pulsing-node" style="transform-origin: 160px 140px;">
    <circle cx="160" cy="140" r="14" fill="#38BDF8" opacity="0.25"/>
  </g>
  <g class="pulsing-node-delay" style="transform-origin: 720px 140px;">
    <circle cx="720" cy="140" r="14" fill="#C084FC" opacity="0.25"/>
  </g>

  <!-- High-Contrast Foreground Card for Title Protection -->
  <rect x="110" y="38" width="660" height="204" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" opacity="0.94" filter="url(#subtleGlow)"/>

  <!-- Foreground Content (Guaranteed 100% visible, never obstructed) -->
  <g>
    <!-- Top Pill / Badge -->
    <g class="shimmer-badge">
      <rect x="345" y="56" width="190" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
      <circle cx="361" cy="69" r="4" fill="#38BDF8" />
      <text x="373" y="73" class="pill-text">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="440" y="126" text-anchor="middle" class="title-text">
      Awesome Git-Based CMS
    </text>

    <!-- Accent Underline Bar -->
    <rect x="360" y="142" width="160" height="3" rx="1.5" fill="url(#accentGrad)" />

    <!-- Subtitle Line 1 -->
    <text x="440" y="176" text-anchor="middle" class="subtitle-text">
      Git-Native • Flat-File • Markdown &amp; MDX • Jamstack Architecture
    </text>

    <!-- Subtitle Line 2 -->
    <text x="440" y="202" text-anchor="middle" class="subtitle-text" font-size="14px" fill="#64748B">
      Content Versioning • Zero Database Lock-in • Astro • Next.js • Hugo • 11ty
    </text>
  </g>
</svg>
